<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blocker Temporaneo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>🚫 Blocker Temporaneo</h1>
    
    <!-- Sezione sito corrente -->
    <div class="section">
      <h2>Sito Corrente</h2>
      <div id="currentSite" class="current-site">Caricamento...</div>
      <button id="blockCurrentBtn" class="btn btn-primary">Blocca questo sito</button>
    </div>

    <!-- Sezione blocco multiplo -->
    <div class="section">
      <button id="toggleMultiBlockBtn" class="btn btn-secondary">📋 Blocco Multiplo</button>
      
      <div id="multiBlockSection" class="multi-block-section" style="display: none;">
        <h3>Aggiungi fino a 5 siti</h3>
        
        <!-- Social network popolari -->
        <div class="social-presets">
          <p class="label">Social Network Popolari:</p>
          <label class="checkbox-label">
            <input type="checkbox" value="facebook.com" class="social-checkbox">
            <span>Facebook (facebook.com)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="instagram.com" class="social-checkbox">
            <span>Instagram (instagram.com)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="tiktok.com" class="social-checkbox">
            <span>TikTok (tiktok.com)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="twitter.com" class="social-checkbox">
            <span>Twitter/X (twitter.com)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="youtube.com" class="social-checkbox">
            <span>YouTube (youtube.com)</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" value="reddit.com" class="social-checkbox">
            <span>Reddit (reddit.com)</span>
          </label>
        </div>

        <!-- Input manuali -->
        <div class="manual-inputs">
          <p class="label">Oppure inserisci URL personalizzati:</p>
          <input type="text" class="url-input" placeholder="es: example.com">
          <input type="text" class="url-input" placeholder="es: another-site.com">
          <input type="text" class="url-input" placeholder="es: third-site.com">
          <input type="text" class="url-input" placeholder="es: fourth-site.com">
          <input type="text" class="url-input" placeholder="es: fifth-site.com">
        </div>

        <button id="addMultipleSitesBtn" class="btn btn-primary">Aggiungi Siti alla Lista</button>
      </div>
    </div>

    <!-- Lista siti bloccati -->
    <div class="section">
      <h2>Siti Bloccati</h2>
      <div id="blockedList" class="blocked-list">
        <p class="empty-message">Nessun sito bloccato al momento</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
